<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оферта — Богатство Семьи</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Manrope:wght@600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #010c06;
      color: #fff;
      font-family: 'Inter', sans-serif;
    }

    body {
      position: relative;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        linear-gradient(to right, rgba(1,12,6,0.96) 0%, rgba(1,12,6,0.78) 42%, rgba(65,49,30,0.84) 100%),
        linear-gradient(to right, #378755, #41311e);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      background: url('assets/bg-texture.png') center / cover no-repeat;
      opacity: 0.34;
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      right: -120px;
      top: 110px;
      width: 430px;
      height: 330px;
      z-index: 0;
      border-radius: 50%;
      background: #ffe2ac;
      filter: blur(76px);
      opacity: 0.28;
      pointer-events: none;
    }

    .oferta-page {
      position: relative;
      z-index: 1;
      width: min(1360px, calc(100vw - 56px));
      margin: 0 auto;
      min-height: 100vh;
      padding: 34px 0 52px;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .oferta-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
    }

    .oferta-brand {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .oferta-logo {
      width: 206px;
      height: auto;
      display: block;
    }

    .oferta-badge {
      width: fit-content;
      min-height: 42px;
      padding: 0 18px;
      border: 1.5px solid rgba(255,204,100,0.44);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #ffcc64;
      background: linear-gradient(135deg, rgba(255,226,172,0.18), rgba(255,204,100,0.06));
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06), 0 12px 30px rgba(0,0,0,0.20);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
    }

    .oferta-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffcc64;
      box-shadow: 0 0 14px rgba(255,204,100,0.55);
      flex-shrink: 0;
    }

    .oferta-title {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      font-weight: 700;
      line-height: 1.08;
      color: #ffe2ac;
      text-transform: uppercase;
    }

    .oferta-sub {
      max-width: 560px;
      margin: 6px 0 0;
      color: rgba(255,255,255,0.78);
      font-size: 18px;
      line-height: 1.42;
    }

    .oferta-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .oferta-link {
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #4f411b;
      background: linear-gradient(251deg,#ffe2ac,#fff1d8,#ffe2ac);
      border: 1px solid rgba(255,255,255,0.72);
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .oferta-back {
      color: #fff;
      border: 1px solid rgba(255,255,255,0.24);
      background: rgba(255,255,255,0.08);
    }

    .oferta-frame-wrap {
      position: relative;
      min-height: 72vh;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 28px;
      overflow: hidden;
      background: rgba(255,255,255,0.12);
      box-shadow: 0 30px 90px rgba(0,0,0,0.34);
      backdrop-filter: blur(18px);
    }

    .oferta-frame-wrap::before {
      content: '';
      position: absolute;
      left: 50%;
      top: -72px;
      width: 720px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,226,172,0.26) 0%, transparent 70%);
      pointer-events: none;
      transform: translateX(-50%);
    }

    .oferta-frame {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 78vh;
      min-height: 720px;
      border: 0;
      border-radius: 18px;
      display: block;
      background: #fff;
    }

    @media (max-width: 767px) {
      .oferta-page {
        width: calc(100vw - 28px);
        padding: 22px 0 30px;
        gap: 18px;
      }

      .oferta-top {
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
      }

      .oferta-brand {
        gap: 14px;
      }

      .oferta-logo {
        width: 168px;
      }

      .oferta-badge {
        min-height: 36px;
        padding: 0 14px;
        font-size: 12px;
        white-space: normal;
      }

      .oferta-title {
        font-size: 30px;
      }

      .oferta-sub {
        font-size: 14px;
      }

      .oferta-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .oferta-link {
        width: 100%;
      }

      .oferta-frame-wrap {
        padding: 8px;
        border-radius: 18px;
      }

      .oferta-frame {
        height: 78vh;
        min-height: 620px;
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="oferta-page">
    <header class="oferta-top">
      <div class="oferta-brand">
        <img class="oferta-logo" src="assets/logo.svg" alt="Богатство Семьи Форум">
        <span class="oferta-badge">26 сентября в 10:00 мск / г. Москва</span>
        <div>
          <h1 class="oferta-title">Оферта</h1>
          <p class="oferta-sub">Договор публичной оферты для участия в форуме «Богатство Семьи»</p>
        </div>
      </div>
      <div class="oferta-actions">
        <a class="oferta-link oferta-back" href="/bogatstvo-semi/">Вернуться на сайт</a>
        <a class="oferta-link" href="/bogatstvo-semi/oferta.pdf" target="_blank" rel="noopener">Открыть PDF</a>
      </div>
    </header>

    <div class="oferta-frame-wrap">
      <iframe
        class="oferta-frame"
        src="/bogatstvo-semi/oferta.pdf"
        title="Оферта Богатство Семьи">
      </iframe>
    </div>
  </main>
</body>
</html>
