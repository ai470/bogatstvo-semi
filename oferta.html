<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оферта — Богатство Семьи</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Manrope:wght@600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #010c06;
      color: #fff;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 78% 8%, rgba(255,226,172,0.20), transparent 28%),
        linear-gradient(157deg,#172545,#2e416b,#172646);
    }

    .oferta-page {
      width: min(1440px, calc(100vw - 48px));
      margin: 0 auto;
      padding: 36px 0 44px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .oferta-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .oferta-title {
      margin: 0;
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 700;
      line-height: 1.12;
      color: #ffe2ac;
    }

    .oferta-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .oferta-link {
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #4f411b;
      background: linear-gradient(251deg,#ffe2ac,#fff1d8,#ffe2ac);
      border: 1px solid rgba(255,255,255,0.72);
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .oferta-back {
      color: rgba(255,255,255,0.82);
      border: 1px solid rgba(255,255,255,0.24);
      background: rgba(255,255,255,0.08);
    }

    .oferta-frame-wrap {
      min-height: 72vh;
      border-radius: 28px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 28px 80px rgba(0,0,0,0.28);
    }

    .oferta-frame {
      width: 100%;
      height: 78vh;
      min-height: 720px;
      border: 0;
      display: block;
      background: #fff;
    }

    @media (max-width: 767px) {
      .oferta-page {
        width: calc(100vw - 24px);
        padding: 20px 0 28px;
        gap: 16px;
      }

      .oferta-top {
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
      }

      .oferta-title {
        font-size: 30px;
      }

      .oferta-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .oferta-link {
        width: 100%;
      }

      .oferta-frame-wrap {
        border-radius: 18px;
      }

      .oferta-frame {
        height: 78vh;
        min-height: 620px;
      }
    }
  </style>
</head>
<body>
  <main class="oferta-page">
    <header class="oferta-top">
      <h1 class="oferta-title">Оферта</h1>
      <div class="oferta-actions">
        <a class="oferta-link oferta-back" href="/bogatstvo-semi/">Вернуться на сайт</a>
        <a class="oferta-link" href="/bogatstvo-semi/oferta.pdf" target="_blank" rel="noopener">Открыть PDF</a>
      </div>
    </header>

    <div class="oferta-frame-wrap">
      <iframe
        class="oferta-frame"
        src="/bogatstvo-semi/oferta.pdf"
        title="Оферта Богатство Семьи">
      </iframe>
    </div>
  </main>
</body>
</html>
